version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
  commit-message:
    prefix: "ci(github-actions)"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  reviewers:
  - RandomByte
  - flovogt
  versioning-strategy: increase
  cooldown:
    default-days: 2
  commit-message:
    prefix: "deps"
    prefix-development: "build(deps-dev)"
  ignore:
    # Additional dependencies requiring higher node versions than we currently support
    - dependency-name: "execa"
      update-types: ["version-update:semver-major"]
    - dependency-name: "he"
      update-types: ["version-update:semver-major"]
