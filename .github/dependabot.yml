version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
  commit-message:
    prefix: "ci(github-actions)"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  reviewers:
  - RandomByte
  - flovogt
  versioning-strategy: increase
  cooldown:
    default-days: 2
  commit-message:
    prefix: "deps"
    prefix-development: "build(deps-dev)"
  ignore:
    - dependency-name: "eslint-plugin-ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "eslint"
      update-types: ["version-update:semver-major"]

