version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
  commit-message:
    prefix: "ci(github-actions)"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  reviewers:
  - RandomByte
  - flovogt
  versioning-strategy: increase
  cooldown:
    default-days: 2
  commit-message:
    prefix: "deps"
    prefix-development: "build(deps-dev)"
  ignore:
    # CPOUI5FOUNDATION-1335: eslint-plugin-ava, ava, and eslint have to be updated together once the node requirement is bumped
    # (causes breaking changes with current node version):
    # eslint-plugin-ava@17 requires node 22 or newer
    - dependency-name: "eslint-plugin-ava"
      update-types: ["version-update:semver-major"]
    # ava@8 requires node 22.20 || 24.12 or newer
    - dependency-name: "ava"
      update-types: ["version-update:semver-major"]
    # eslint@10 requires node ^20.19.0 || ^22.13.0 || >=24
    - dependency-name: "eslint"
      update-types: ["version-update:semver-major"]

