name: release-please

on:
  workflow_dispatch:
    inputs:
      package-folder:
        description: 'The package to be released'
        required: true
        type: choice
        options:
          - middleware-code-coverage
      confirm_publish:
        description: "Type 'publish' to confirm (re-)publishing the selected package against current main (version from its package.json). Use only when a prior publish failed before the package reached npm; republishing an existing version fails with 403."
        required: true
        type: string
  push:
    branches:
      - main

permissions: {}

jobs:
  pull-request:
    # release-please runs only on push. Manual dispatch is publish-only and
    # must not open or update a release PR.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{steps.release.outputs.releases_created}}
      paths_released: ${{steps.release.outputs.paths_released}}
    steps:
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      id: release
      with:
        token: ${{secrets.GH_OPENUI5BOT}}
        path: packages/${{inputs.package-folder}}
  publish-package:
    needs: pull-request
    if: >-
      ${{ !cancelled()
          && ((github.event_name == 'workflow_dispatch' && inputs.confirm_publish == 'publish')
              || (needs.pull-request.result == 'success'
                  && needs.pull-request.outputs.releases_created
                  && toJson(fromJson(needs.pull-request.outputs.paths_released || '[]')) != '[]')) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Required for trusted publishing via OIDC (https://docs.npmjs.com/trusted-publishers)
    # The GitHub Actions Environment configured for the trusted publisher
    environment: npmjs:@ui5/middleware-code-coverage
    strategy:
      matrix:
        path_released: ${{ github.event_name == 'workflow_dispatch'
          && fromJson(format('["packages/{0}"]', inputs.package-folder))
          || fromJson(needs.pull-request.outputs.paths_released || '[]') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Node.js LTS
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Publish to npm
      env:
        PATH_RELEASED: ${{matrix.path_released}}
      run: |
        cd "$PATH_RELEASED"
        npm publish --workspaces false --access public --tag next
