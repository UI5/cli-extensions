# As coverage-lib-ts.yaml, but with a custom `excludePatterns` so the middleware does NOT instrument
# the matched module (`Thing`) while still instrumenting the rest — exercising config-driven
# exclusion end to end.
specVersion: "5.0"
metadata:
  name: covered.lib
type: library
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
      configuration:
        excludePatterns:
          - "/resources/covered/lib/Thing.js"
