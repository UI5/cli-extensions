# Specification Version 5.0 so the coverage middleware receives `builtResources`
# (the build output: `-dbg` sources, their source maps, and the `library-preload.js`
# bundle). Serves the TypeScript probe library `covered.lib`; the transpile task turns
# `Thing.ts` into the `.js`/`-dbg.js` + source map that Option C and the TS remap rely on.
specVersion: "5.0"
metadata:
  name: covered.lib
type: library
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
