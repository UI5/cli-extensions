# Serves the plain-JS library `covered.dep` standalone with the coverage middleware, so its `.library`
# jscoverage excludes (which exclude `Helper`) are applied — exercising .library-driven exclusion end
# to end. (The same library doubles as the dependency in the cross-project coverage test.)
specVersion: "5.0"
metadata:
  name: covered.dep
type: library
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
