# As coverage-lib-ts.yaml, but configures an additional non-default reporter (lcov) so the report
# endpoint exposes and serves more than the default html report.
specVersion: "5.0"
metadata:
  name: covered.lib
type: library
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
      configuration:
        report:
          reporter:
            - html
            - lcovonly
